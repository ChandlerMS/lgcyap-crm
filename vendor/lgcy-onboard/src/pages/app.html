<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>LGCY Onboard · Legacy Recruiting CRM</title>
<link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png"><link rel="manifest" href="/brand/manifest.webmanifest">
<meta name="theme-color" content="#0b0b0a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="LGCY Onboard"><meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Legacy Agency Partners look, as in the call overlay and command center: Michroma for the brand, Inter for text,
   black ground with metallic gold. Dark by default; the overlay's "Parchment" light skin sits behind the sun / moon
   switch in the rail (owner, 2026-10-29) and is remembered per browser.
   Layout: fixed left rail of tabs, a working area that scrolls, cards only where something is a separate object. */
:root {
  --bg: #0b0b0a; --card: #141412; --card2: #181713; --well: #0f0e0c; --line: #2b281f; --line2: #3d3620;
  --fg: #ece6d6; --muted: #9c9583; --gold: #e3bf5e; --gold2: #f1d27a; --gold-dim: #6e5a1c; --ink: #1d1503;
  --ok: #5fc58a; --bad: #e0705e; --warn: #f0c36b; --info: #8ab4f8; --violet: #b69cf0; --teal: #6fd3c7;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; --brand: 'Michroma', 'Segoe UI', sans-serif;
  --gold-metal: linear-gradient(180deg, #fff1b8 0%, #f0cf6c 22%, #c9952e 48%, #a8781c 56%, #dcb455 78%, #f8e39a 100%);
  --gold-text: linear-gradient(180deg, #fff3c4 0%, #f1d27a 35%, #c8963c 62%, #e9c76a 100%);
  --raise: linear-gradient(180deg, #2c2922 0%, #1c1a15 55%, #15130f 100%);
  --rail: 236px;
  color-scheme: dark;
}
.app.dark {
  --bg: #0b0b0a; --card: #141412; --card2: #181713; --well: #0f0e0c; --line: #2b281f; --line2: #3d3620;
  --fg: #ece6d6; --muted: #9c9583; --gold: #e3bf5e; --gold2: #f1d27a; --gold-dim: #6e5a1c; --ink: #1d1503;
  --ok: #5fc58a; --bad: #e0705e; --warn: #f0c36b; --info: #8ab4f8; --violet: #b69cf0; --teal: #6fd3c7;
  --gold-metal: linear-gradient(180deg, #fff1b8 0%, #f0cf6c 22%, #c9952e 48%, #a8781c 56%, #dcb455 78%, #f8e39a 100%);
  --gold-text: linear-gradient(180deg, #fff3c4 0%, #f1d27a 35%, #c8963c 62%, #e9c76a 100%);
  --raise: linear-gradient(180deg, #2c2922 0%, #1c1a15 55%, #15130f 100%);
}
/* Light skin "Parchment" (from the call overlay, owner 2026-10-20): off-white tan, dark brown text, deeper gold.
   Text boxes are cream and pressed in; buttons stand up, the main ones in gold chrome. */
html.light, .app.light {
  --bg: #f4eee2; --card: #fbf8f1; --card2: #fffdf8; --well: #efe7d6; --line: #e2d7bf; --line2: #cdbf9f;
  --fg: #2b2416; --muted: #5c513e; --gold: #b08a24; --gold2: #7a5a0e; --gold-dim: #c9a64a; --ink: #2b1f05;
  --ok: #1d7f4a; --bad: #b83232; --warn: #935d00; --info: #2f5fa8; --violet: #5a3f96; --teal: #1f7f78;
  --gold-metal: linear-gradient(180deg, #e3c063 0%, #f3dc93 50%, #c99f37 100%);
  --gold-text: linear-gradient(180deg, #a87c1e 0%, #d1a83e 55%, #8a6512 100%);
  --raise: linear-gradient(180deg, #fffdf7, #efe5d0);
  color-scheme: light;
}
html.light body, .app.light { font-weight: 500; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font: 400 19px/1.2 var(--brand); letter-spacing: .06em; }
h2 { font-size: 15px; font-weight: 700; background: var(--gold-text); -webkit-background-clip: text; background-clip: text; color: transparent; width: fit-content; }
h3 { font-size: 13px; font-weight: 600; }
a { color: var(--gold2); }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.goldtext { background: var(--gold-text); -webkit-background-clip: text; background-clip: text; color: transparent; }
.num { font-variant-numeric: tabular-nums; }

/* App frame */
.app { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); height: 100%; }
.rail { background: radial-gradient(600px 300px at 0% -10%, #1d1a10 0%, transparent 60%), #0d0d0b; border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 14px 12px; padding-left: max(12px, env(safe-area-inset-left, 0px)); gap: 6px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 14px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.brand img { height: 36px; width: auto; display: block; }
.brand img.dk { display: none; } .app.light .brand img.dk { display: block; } .app.light .brand img.lt { display: none; }
.brand b { display: block; font: 400 17px/1 var(--brand); letter-spacing: .1em; background: var(--gold-text); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand small { display: block; margin-top: 4px; font: 400 8.5px/1 var(--brand); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.rail .seg.office { margin: 0 0 8px; } .rail .seg.office button { flex: 1; text-align: center; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; color: var(--fg); text-decoration: none; font-weight: 500; border: 1px solid transparent; }
.nav a svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
.nav a:hover { background: #17150f; }
.nav a.on { background: var(--raise); border-color: #3a3528; box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 2px 0 #050504; }
.nav a.on svg { color: var(--gold); }
.nav a .badge { margin-left: auto; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--gold-metal); color: var(--ink); }
.rail .me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-top: 1px solid var(--line); }
.rail .me select { width: 100%; font-size: 12px; padding: 4px 6px; }
.rail .me .who { min-width: 0; flex: 1; }
.rail .me small.acc { color: var(--gold2); }
.rail .nav.bottom { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--line); }
.rail .me { margin-top: 0; }
.rail .nav.bottom:empty { padding: 0; border: 0; }
.rail .skin { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 8px 0; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
/* Sun / moon switch, as in the call overlay: dark (black and gold) or light (Parchment). */
.themetg { position: relative; flex: none; width: 50px; height: 26px; padding: 0; border-radius: 999px; border: 1px solid var(--line2); background: var(--well); cursor: pointer; box-shadow: none; }
.themetg:hover { border-color: var(--gold); }
.themetg:active:not(:disabled) { transform: none; box-shadow: none; }
.themetg span { position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--gold-metal); color: #1a1403; transition: transform .2s ease; }
.themetg svg { display: block; }
.app.light .themetg span { transform: translateX(24px); color: #5e4407; box-shadow: 0 1px 2px rgba(80,60,20,.25); }
@media (prefers-reduced-motion: reduce) { .themetg span { transition: none; } }
.lr { font-size: 11px; color: var(--muted); white-space: nowrap; }
.lr.stale { color: var(--warn); }
.lr.never { color: var(--info); }
.rule .w b .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 12px var(--sans); color: var(--ink); background: var(--gold-metal); box-shadow: inset 0 1px 0 rgba(255,250,220,.8), 0 1px 3px rgba(0,0,0,.5); flex: none; }
.avatar.sm { width: 24px; height: 24px; font-size: 10px; }
.avatar.ink { background: var(--raise); color: var(--gold2); border: 1px solid var(--line2); }
.me b { display: block; font-size: 13px; }
.me small { display: block; font-size: 11px; color: var(--muted); }
main { overflow-y: auto; overflow-x: hidden; padding-block: 16px 60px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); min-width: 0; }
.topbar { display: none; }
.bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.bar h1 { margin-right: auto; }
.lede { color: var(--muted); max-width: 70ch; margin-bottom: 14px; }

/* Controls, as in the command center: buttons stand up and press down. */
button { background: var(--raise); color: var(--fg); border: 1px solid #3a3528; border-radius: 9px; padding: 7px 13px; cursor: pointer; font: 500 13.5px var(--sans);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.09), inset 0 -1px 0 rgba(0,0,0,.4), 0 2px 0 #050504, 0 3px 8px rgba(0,0,0,.45); transition: transform .08s ease, box-shadow .08s ease, border-color .15s ease; }
button:hover { border-color: #8a6d2a; }
button:active:not(:disabled) { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 0 0 #050504, 0 1px 3px rgba(0,0,0,.5); }
button.primary, button.on { background: var(--gold-metal); color: var(--ink); border-color: #8a6516; font-weight: 700; text-shadow: 0 1px 0 rgba(255,240,190,.55);
  box-shadow: inset 0 1px 0 rgba(255,250,220,.85), inset 0 -2px 0 rgba(110,72,8,.45), 0 2px 0 #5a3f0a, 0 4px 10px rgba(0,0,0,.5); }
button.ghost { background: none; border-color: transparent; box-shadow: none; color: var(--muted); padding: 4px 8px; }
button.ghost:hover { color: var(--fg); border-color: var(--line2); }
button.danger { color: var(--bad); border-color: #6a2a22; }
button.sm { padding: 4px 10px; font-size: 12px; }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold2); outline-offset: 2px; }
input, select, textarea { box-shadow: inset 0 1px 3px rgba(0,0,0,.6); background: var(--well); color: var(--fg); border: 1px solid var(--line2); border-radius: 6px; padding: 6px 8px; font: inherit; max-width: 100%; }
textarea { width: 100%; min-height: 64px; resize: vertical; }
input[type=search] { min-width: 220px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
label.f input, label.f select, label.f textarea { font-size: 13.5px; color: var(--fg); }
.seg { display: inline-flex; padding: 2px; gap: 2px; border: 1px solid var(--line2); border-radius: 999px; background: var(--bg); }
.seg button { padding: 3px 11px; border: 0; border-radius: 999px; background: transparent; box-shadow: none; color: var(--muted); font-size: 12px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--gold-metal); color: var(--ink); }

.card { background: linear-gradient(180deg, var(--card2), var(--card)); border: 1px solid var(--line); border-radius: 12px; padding: 14px; box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 6px 18px rgba(0,0,0,.3); min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
.kpi { background: linear-gradient(180deg, var(--card2), var(--card)); border: 1px solid var(--line); border-radius: 12px; padding: 12px; box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 6px 18px rgba(0,0,0,.3); cursor: pointer; }
.kpi:hover { border-color: #8a6d2a; }
.kpi b { display: block; font-size: 24px; font-weight: 700; background: var(--gold-text); -webkit-background-clip: text; background-clip: text; color: transparent; width: fit-content; font-variant-numeric: tabular-nums; }
.kpi span { color: var(--muted); font-size: 12px; }
.kpi i { display: block; font-style: normal; font-size: 11px; margin-top: 4px; color: var(--ok); }
.kpi i.down { color: var(--bad); }
.pill { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line2); color: var(--fg); }
.pill.ok { color: var(--ok); border-color: #2c5a3e; } .pill.bad { color: var(--bad); border-color: #6a2a22; } .pill.warn { color: var(--warn); border-color: #6b5427; } .pill.info { color: var(--info); border-color: #2c4a6e; }
.pill.gold { color: var(--ink); background: var(--gold-metal); border-color: #8a6516; font-weight: 700; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 12px; padding: 1px 7px; border-radius: 6px; background: #1d1b16; border: 1px solid var(--line); }
.wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
th button.sort { all: unset; cursor: pointer; font: inherit; color: inherit; display: inline-flex; gap: 4px; align-items: center; }
th button.sort::after { content: '↕'; color: var(--muted); font-size: 11px; opacity: .6; }
th[aria-sort="ascending"] button.sort::after { content: '▲'; color: var(--gold); opacity: 1; }
th[aria-sort="descending"] button.sort::after { content: '▼'; color: var(--gold); opacity: 1; }
td.n, th.n { text-align: right; }
tr.r:hover td { background: #17150f; cursor: pointer; }
.empty { color: var(--muted); padding: 18px; text-align: center; border: 1px dashed var(--line2); border-radius: 10px; }

/* Funnel and bars */
.funnel { display: flex; flex-direction: column; gap: 6px; }
.frow { display: grid; grid-template-columns: 150px 1fr 48px; gap: 10px; align-items: center; font-size: 13px; }
.frow .track { height: 18px; background: var(--well); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
.frow .fill { height: 100%; border-radius: 3px; background: var(--gold-metal); min-width: 2px; }
.frow .fill.c { background: var(--c); }
.frow b { text-align: right; font-variant-numeric: tabular-nums; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding-top: 8px; border-bottom: 1px solid var(--line); }
.bars .b { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; min-width: 0; }
.bars .b i { display: block; width: 100%; max-width: 44px; background: var(--gold-metal); border-radius: 4px 4px 0 0; }
.bars .b i.dim { background: #3a3528; }
.bars .b span { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }

/* Pipeline board */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: 256px; gap: 10px; overflow-x: auto; padding-bottom: 12px; align-items: start; }
.col { background: #100f0d; border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; max-height: calc(100vh - 150px); min-height: 160px; }
.col.over { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.col .head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #100f0d; border-radius: 12px 12px 0 0; }
.col .head b { font-size: 13px; }
.col .head .cnt { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.col .head .auto { font-size: 11px; color: var(--gold); cursor: pointer; border: 0; background: none; box-shadow: none; padding: 0 4px; }
.col .cards { padding: 8px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; min-height: 60px; }
.cand { background: linear-gradient(180deg, var(--card2), var(--card)); border: 1px solid var(--line); border-radius: 10px; padding: 10px; cursor: grab; box-shadow: 0 2px 0 #050504, 0 3px 8px rgba(0,0,0,.35); position: relative; }
.cand:hover { border-color: #8a6d2a; }
.cand.dragging { opacity: .4; }
.cand .nm { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.cand .nm .days { margin-left: auto; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cand .nm .days.late { color: var(--warn); }
/* A cancelled pre-screen (owner, 2026-11-02): a red ! on the card and the calendar; click it for who cancelled. */
.cxl { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--bad); color: #fff; font: 800 12px/1 Inter, sans-serif; font-style: normal; cursor: pointer; flex: none; border: 0; padding: 0; }
.cxl:hover { filter: brightness(1.15); }
.tag.appt.off { text-decoration: line-through; opacity: .75; }
.ev.off { --c: var(--bad) !important; z-index: 1; }
.ev.off b { text-decoration: line-through; padding-right: 16px; }
.ev .cxl { position: absolute; top: 2px; right: 2px; width: 15px; height: 15px; font-size: 10px; }
.pill.cxp { cursor: pointer; color: var(--bad); border-color: var(--bad); }
.cand .meta { font-size: 12px; color: var(--muted); margin-top: 3px; display: flex; gap: 6px; flex-wrap: wrap; }
.cand .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.cand .tag { font-size: 11px; padding: 0 6px; border-radius: 5px; border: 1px solid var(--line2); color: var(--muted); }
.cand .tag.lic { color: var(--ok); border-color: #2c5a3e; } .cand .tag.unlic { color: var(--warn); border-color: #6b5427; } .cand .tag.task { color: var(--gold2); border-color: var(--gold-dim); }
.cand .foot { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.cand .foot select { font-size: 11px; padding: 2px 4px; margin-left: auto; max-width: 110px; }
.src { font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
.src i { width: 14px; height: 14px; border-radius: 3px; display: inline-grid; place-items: center; font-style: normal; font-size: 9px; font-weight: 800; color: #fff; }
.src i.indeed { background: #2557a7; } .src i.linkedin { background: #0a66c2; } .src i.web { background: #8a6516; } .src i.referral { background: #2c5a3e; } .src i.zip { background: #5a3f8a; }

/* Candidate profile */
.phead { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.phead > .avatar { width: 54px; height: 54px; font-size: 18px; }
.phead .who { flex: 1; min-width: 220px; }
.phead .who h1 { font: 700 20px/1.2 var(--sans); letter-spacing: 0; }
.phead .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px 14px; margin-top: 12px; }
.fact span { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.fact { min-width: 0; }
/* Contact line under the pills in the profile header: phone, email, city (owner, 2026-10-30). */
.hcontact { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; font-size: 13px; }
.hcontact span { display: inline-flex; align-items: center; gap: 6px; min-width: 0; overflow-wrap: anywhere; }
.hcontact i { font-style: normal; color: var(--gold); font-size: 12px; }
.hcontact a { color: inherit; text-decoration: none; }
.hcontact .ed { cursor: pointer; border-radius: 6px; padding: 1px 4px; margin: -1px -4px; }
.hcontact .ed em { font-style: normal; font-size: 11px; color: var(--muted); opacity: 0; transition: opacity .15s; }
.hcontact .ed:hover { background: var(--well); } .hcontact .ed:hover em { opacity: 1; }
.hcontact input.edin { font: inherit; font-size: 13px; padding: 3px 7px; width: min(280px, 70vw); }
/* Overview: the details that are not in the header, one condensed row. */
.drow { display: flex; flex-wrap: wrap; gap: 6px 22px; padding: 12px 16px; }
.drow > div { min-width: 0; } .drow span { display: block; font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; } .drow b { font-weight: 600; font-size: 13px; overflow-wrap: anywhere; }
/* Phone and email on each pipeline card (owner, 2026-10-30); a long email is cut with … and shown whole on hover. */
.cand .cline { display: flex; flex-direction: column; gap: 1px; margin-top: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
.cand .cline span { display: flex; align-items: center; gap: 5px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

<script>
/* ---------- Reference data: the applicant lifecycle, its automations, the pre-screen script ---------- */
const TODAY = new Date(); // online: the real clock // the mockup's "now": Tue Oct 27, 2026
let ME = 'Carlos Lonsdale';
let ACCESS = 'admin'; // 'admin' | 'recruiter' (owner, 2026-10-29)
const isAdmin = () => ACCESS === 'admin';
// The team (owner, 2026-10-27). Recruiters work New applicant through Pre-screen; contracting & licensing admins own
// License in progress through Contracting started; trainers own Scheduled training and Cholitos. Group Reviews are
// led by the office's recruiters (GR_LEADS).
const TEAM = [
  { name: 'Carlos Lonsdale',  role: 'Owner · Recruiter',               roles: ['recruiter'],          access: ['admin', 'recruiter'], email: 'carlos@lgcyap.com',  ini: 'CL', color: '#e3bf5e', super: true },
  { name: 'Ed Lonsdale',      role: 'Recruiter',                       roles: ['recruiter'],          access: ['admin', 'recruiter'], email: 'ed@lgcyap.com',      ini: 'EL', color: '#8ab4f8' },
  { name: 'Ivanna Matiz',     role: 'Recruiter · Contracting & licensing', roles: ['recruiter', 'admin'], access: ['admin', 'recruiter'], email: 'ivanna@lgcyap.com', ini: 'IM', color: '#6fd3c7' },
  { name: 'Nina Castro',      role: 'Outside recruiter',               roles: ['recruiter'],          access: ['recruiter'],          email: 'nina.castro@gmail.com', ini: 'NC', color: '#c9b37a', outside: true },
  { name: 'Sarah Heckman',    role: 'Contracting & licensing',         roles: ['admin'],              access: ['admin'], email: 'sarah@lgcyap.com',   ini: 'SH', color: '#f0c36b' },
  { name: 'Brianna Murray',   role: 'Contracting & licensing',         roles: ['admin'],              access: ['admin'], email: 'brianna@lgcyap.com', ini: 'BM', color: '#b69cf0' },
  { name: 'Oshana Balarezo',  role: 'Contracting & licensing',         roles: ['admin'],              access: ['admin'], email: 'oshana@lgcyap.com',  ini: 'OB', color: '#e0705e' },
  { name: 'Anthony Gonzales', role: 'Trainer · training & Cholitos',    roles: ['trainer'],           access: ['admin'], email: 'anthony@lgcyap.com', ini: 'AG', color: '#5fc58a' },
  { name: 'AJ Rios',          role: 'Trainer · training & Cholitos',    roles: ['trainer'],           access: ['admin'], email: 'aj@lgcyap.com',      ini: 'AJ', color: '#f1d27a' },
];
const BY_ROLE = r => TEAM.filter(t => t.roles.includes(r) && t.status !== 'inactive').map(t => t.name);
// Super admin (the owner): the only one who can grant or remove Admin access. Every other admin assigns the other roles.
const isSuper = () => isAdmin() && !!(TEAM.find(t => t.name === ME) || {}).super;
const ROLE_NAMES = { recruiter: 'Recruiter', admin: 'Contracting & licensing', trainer: 'Trainer' };
const roleLabel = t => (t.super ? 'Owner · ' : '') + (t.roles.map(r => r === 'recruiter' && t.outside ? 'Outside recruiter' : ROLE_NAMES[r]).join(' · ') || 'User');
const OFFICES = [
  { id: 'Orlando', name: 'Orlando (HQ)', address: '8517 Southpark Circle, Suite 400 (4th Floor), Orlando, FL 32819', parking: 'Onsite parking' },
  { id: 'Miami',   name: 'Miami',        address: '33 SW 2nd Ave, Suite 801 (8th Floor), Miami, FL 33130',            parking: 'Street parking' },
];
const OFFICE = { label: 'Nearest office', city: 'Orlando, FL 32819' };
// Group Review (owner, 2026-10-30): Orlando on Tuesdays at 6 pm from Nov 10 and Wednesdays at 4 pm from Nov 4;
// Miami on Thursdays at 2 pm from Nov 5 (owner, 2026-11-02). 25 seats each.
// Training: classes of at most 15; the first class date is TBD.
const ORIENTATION = { day: 'Tuesday or Wednesday', hour: 16, cap: 25, where: 'Orlando (HQ)' };
const GR_SLOTS = [{ office: 'Orlando', dow: 3, hour: 16, from: new Date(2026, 10, 4), label: 'Wednesdays 4 pm', short: 'Wed 4 pm' }, { office: 'Orlando', dow: 2, hour: 18, from: new Date(2026, 10, 10), label: 'Tuesdays 6 pm', short: 'Tue 6 pm' },
  { office: 'Miami', dow: 4, hour: 14, from: new Date(2026, 10, 5), label: 'Thursdays 2 pm', short: 'Thu 2 pm' }];
// Who leads each office's Group Reviews (owner, 2026-11-02): Orlando Carlos & Ed, Miami Ivanna. The trainers (AJ,
// Anthony) come in once agents are contracted and starting training. Their Google events invite these leads.
const GR_LEADS = { Orlando: ['Carlos Lonsdale', 'Ed Lonsdale'], Miami: ['Ivanna Matiz'] };
const leadLabel = s => (s.leads || [s.lead]).map(n => String(n || '').split(' ')[0]).join(' & ');
// "Tuesdays 6 pm or Wednesdays 4 pm" for one office; both offices when none is given.
const grWhen = (office, short) => { const one = o => GR_SLOTS.filter(sl => sl.office === o).sort((a, b) => a.dow - b.dow).map(sl => short ? sl.short : sl.label).join(' or '); return office ? one(office) : OFFICES.map(o => o.id + ': ' + one(o.id)).join(' · '); };
const GR_WHEN = 'Orlando: Tuesdays 6 pm (from Nov 10) or Wednesdays 4 pm (from Nov 4) · Miami: Thursdays 2 pm (from Nov 5)';
// The next weeks of an office's slots (every office when none is given), soonest first.
const grDates = (weeks = 4, office) => { const out = []; const t0 = new Date(TODAY); t0.setHours(0, 0, 0, 0); GR_SLOTS.filter(sl => !office || sl.office === office).forEach(sl => { const d = new Date(Math.max(t0.getTime(), sl.from.getTime())); d.setHours(sl.hour, 0, 0, 0); d.setDate(d.getDate() + ((sl.dow - d.getDay() + 7) % 7)); for (let i = 0; i < weeks; i++) { out.push(new Date(d)); d.setDate(d.getDate() + 7); } }); return out.sort((a, b) => a - b); };
// Whether a session sits on the schedule (used to drop old empty sessions from saved data).
const isGRSlot = (d, office) => GR_SLOTS.some(sl => (!office || sl.office === office) && d.getDay() === sl.dow && d.getHours() === sl.hour && d >= sl.from);

const upcomingSessions = office => { const t0 = new Date(TODAY); t0.setHours(0, 0, 0, 0); return SESSIONS.filter(s => s.office === office && s.when >= t0).sort((a, b) => a.when - b.when); };
const TRAINING_CAP = 15;

// comes back from; the rest is the main line. "Not moving forward" is the one extra lane, for declines.
const STAGES = [

function vCandidates() {

  let rows = V().filter(c => (!q || (name(c) + c.email + c.city).toLowerCase().includes(q)) && (!f.stage || c.stage === f.stage) && (!f.lic || (f.lic === 'lic' ? c.license.startsWith('Licensed') : f.lic === 'unlic' ? !c.license.startsWith('Licensed') : c.license === f.lic)) && (!f.dl || (f.dl === 'y') === c.dl) && (!f.dist || c.miles <= +f.dist) && (!f.src || c.source === f.src) && (!f.office || c.office === f.office));

// Editing the phone or email in the profile header: one value on the candidate, so it changes everywhere it shows

function editContact(c, field, el) {
  if (!c || el.querySelector('input')) return;
  const cur = c[field] && c[field] !== 'unknown' ? c[field] : '';
  el.innerHTML = `<i>${field === 'phone' ? '☎' : '✉'}</i><input class="edin" type="${field === 'phone' ? 'tel' : 'email'}" value="${esc(cur)}" placeholder="${field === 'phone' ? '(407) 555-0100' : 'name@example.com'}" aria-label="${field === 'phone' ? 'Phone' : 'Email'}">`;
  const inp = el.querySelector('input'); inp.focus(); inp.select(); let done = false;
  const finish = save => {
    if (done) return; done = true; const v = inp.value.trim();
    if (!save || v === cur) { render(); return; }
    if (field === 'email' && v && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) { toast('That email does not look right; nothing was changed.'); render(); return; }
    if (field === 'phone' && v && v.replace(/\D/g, '').length < 10) { toast('That phone number looks too short; nothing was changed.'); render(); return; }
    c[field] = v || 'unknown';
    c.notes.push({ at: new Date(TODAY.getTime() + 60000), by: ME, kind: 'note', text: `${field === 'phone' ? 'Phone' : 'Email'} changed${cur ? ' from ' + cur : ''} to ${v || '(blank)'}` });
    render(); toast(`${field === 'phone' ? 'Phone' : 'Email'} updated for <b>${name(c)}</b>.${field === 'email' && c.gcal ? ' Existing Google invites still go to the old address.' : ''}`);
  };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); finish(true); } else if (e.key === 'Escape') finish(false); });
  inp.addEventListener('blur', () => finish(true));
}

  const list = (k) => { const up = V().filter(c => c[k] && !c[k].done).sort((a, b) => a[k].when - b[k].when); const done = V().filter(c => c[k] && c[k].done).sort((a, b) => b[k].when - a[k].when); return `

// Screener helpers: what a field is prefilled with, whether an item is visible, which ratings count.
function autoVal(c, key) {
  if (key === 'today') return TODAY.toISOString().slice(0, 10);
  if (key === 'applied') return c.applied.toISOString().slice(0, 10);
  if (key === 'state') return c.state || 'FL';
  if (key === 'calltype') return c.source === 'Cold call' || c.source === 'Sourced' ? '' : 'Applicant';
  if (key === 'licenseOpt') return c.license.startsWith('Licensed') ? '2-15' : c.license === 'Studying' || c.license === 'Exam scheduled' ? 'In progress' : c.license === 'Expired' ? 'Expired' : 'None';
  return c[key] == null ? '' : String(c[key]);
}
function fieldVal(c, iv, it) { const f = iv.fields || (iv.fields = {}); return f[it.id] !== undefined ? f[it.id] : (it.auto ? autoVal(c, it.auto) : ''); }
function secOpen(id) { return state.openSections[id] !== undefined ? state.openSections[id] : id === 'ps1'; }
const itemDef = id => { for (const k in SCRIPTS) { const d = SCRIPTS[k].sections.flatMap(s => s.items).find(i => i.id === id); if (d) return d; } return { id }; };
function itemShown(c, iv, it) { if (!it.showIf) return true; const v = fieldVal(c, iv, itemDef(it.showIf.id)); return it.showIf.in ? it.showIf.in.includes(v) : v === it.showIf.eq; }
function itemDone(c, iv, it) { if (it.kind === 'say' || it.kind === 'action') return true; if (it.kind === 'field') return fieldVal(c, iv, it) !== ''; const a = iv.answers[it.id] || {}; return it.kind === 'rate' ? !!a.score : !!(a.score || a.text); }
function allScores(sc, iv) { return sc.sections.flatMap(s => s.items.filter(i => i.kind === 'q' || i.kind === 'rate').map(i => (iv.answers[i.id] || {}).score)).filter(Boolean); }
function sectionRatings(sc, iv) { return sc.sections.flatMap(s => s.items.filter(i => i.kind === 'rate').map(i => ({ label: i.label, score: (iv.answers[i.id] || {}).score }))); }
// AI fill: in the real app an assistant reads the application email, the resume and (when a call is recorded) the
// transcript, and proposes values for every empty field; the recruiter confirms. The mockup fills from what the CRM
// already knows about the candidate.
function aiFill(c, iv) {
  const sc = SCRIPTS.prescreen; const f = iv.fields || (iv.fields = {}); iv.ai = iv.ai || []; let n = 0;
  const guess = { f_transport: c.dl ? 'yes' : 'no', f_commute: c.miles <= 45 ? 'yes' : 'no', f_mf: c.avail.startsWith('Full') ? 'yes' : 'no', f_npn: c.license.startsWith('Licensed') ? String(17000000 + c.id * 7919) : '', f_licstatus: c.license.startsWith('Licensed') ? 'Active' : '', f_states: c.license.includes('GA') ? '2' : c.license.startsWith('Licensed') ? '1' : '', f_zip: c.office === 'Miami' ? '33130' : '32819', f_addr: `${100 + c.id * 13} ${pick(['Palm', 'Lake', 'Orange', 'Bay', 'Park'])} ${pick(['Ave', 'St', 'Dr'])}` };
  sc.sections.forEach(s => s.items.forEach(it => { if (it.kind !== 'field' || it.type === 'date') return; const cur = fieldVal(c, iv, it); if (cur !== '') return; const v = guess[it.id]; if (v) { f[it.id] = v; iv.ai.push(it.id); n++; } }));
  return n;
}

function vInterview() {
  const c = byId(state.iv); const k = state.ivKind; const iv = c[k]; const sc = SCRIPTS[k]; iv.fields = iv.fields || {}; iv.ai = iv.ai || [];

  const items = sc.sections.flatMap(s => s.items.filter(i => i.kind !== 'say' && i.kind !== 'action'));

  const ro = iv.done;

  const field = it => { const v = fieldVal(c, iv, it); const ai = iv.ai.includes(it.id) ? '<span class="aitag" title="Suggested by the assistant; edit to confirm">AI</span>' : ''; const lab = `<span>${esc(fill(it.label))}${ai}</span>`;
    if (it.type === 'yesno') return `<div class="f ${it.wide ? 'wide' : ''}">${lab}<div class="yn">${['yes', 'no'].map(o => `<button class="sm ${v === o ? 'on' : ''}" data-yn="${it.id}:${o}" ${ro ? 'disabled' : ''}>${o === 'yes' ? 'Yes' : 'No'}</button>`).join('')}</div>${it.why ? `<small class="muted">${esc(it.why)}</small>` : ''}</div>`;

    return `<label class="f ${it.wide ? 'wide' : ''}">${lab}<input type="${it.type}" data-f="${it.id}" value="${esc(v)}" ${ro || it.readonly ? 'readonly' : ''}>${it.why ? `<small class="muted">${esc(it.why)}</small>` : ''}</label>`; };

      else if (it.kind === 'action') { const f = iv.fields; const ready = !!(f.f_fu_date && f.f_fu_time); const booked = c.stage === 'prescreen' && iv.followUp; out += `<div class="q"><div class="row" style="justify-content:space-between;gap:12px;align-items:flex-start"><div><div style="margin-bottom:4px">${booked ? `<span class="pill ok">Follow-up booked · ${fmtDT(iv.when)}${iv.how ? ' · ' + esc(iv.how) : ''}</span>` : `<span class="pill ${ready ? 'ok' : 'warn'}">${ready ? 'Ready to book' : 'Enter the date and time first'}</span>`}</div><div class="why">${esc(it.why)}</div></div><button class="primary" data-followup="${c.id}" ${ready && !ro ? '' : 'disabled'} title="${ready ? 'Book the follow-up and move the card' : 'Fill in the follow-up date and time first'}">📅 ${booked ? 'Update follow-up' : esc(it.label)}</button></div></div>`; }
      else if (it.kind === 'q') { const a = iv.answers[it.id] || {}; out += `<div class="q"><div class="say">${esc(fill(it.say))}</div><div class="why">${esc(it.why)}</div><div class="ans"><textarea data-q="${it.id}" placeholder="Their answer, in their words…" ${ro ? 'readonly' : ''}>${esc(a.text || '')}</textarea><div><div class="small muted" style="margin-bottom:4px">Rate</div>${scoreBtns(it.id)}</div></div></div>`; }
      else if (it.kind === 'rate') out += `<div class="q rate"><div class="ans" style="grid-template-columns:1fr auto;align-items:center;margin-top:0"><div><b>Rate: ${esc(it.label)}</b><div class="why">1 = no · 3 = maybe · 5 = yes, clearly</div></div>${scoreBtns(it.id)}</div></div>`; });
    flush(); return out; };
  return `
  <div class="bar"><button class="ghost" data-cand="${c.id}">← ${name(c)}</button><h1 style="margin-right:auto">${sc.name}</h1><span class="pill">${sc.version}</span><span class="muted small num">${answered} of ${total} filled</span><button class="sm" data-openall="1" title="Open every section">Open all</button><button class="sm" data-openall="0" title="Collapse every section">Collapse</button>${ro ? '<span class="pill ok">Scorecard saved</span>' : `<button class="sm" id="aiFill" title="The assistant reads the application email, the resume and the call transcript and proposes values for the empty fields. You confirm.">✨ AI fill</button><button class="primary" id="finishIv">Finish &amp; decide</button>`}</div>
  <div class="iv">
    <div class="stack">
      ${sc.sections.map(sec => { const its = sec.items.filter(i => i.kind !== 'say' && i.kind !== 'action' && itemShown(c, iv, i)); const n = its.filter(i => itemDone(c, iv, i)).length; const open = secOpen(sec.id); return `<div class="section ${open ? 'open' : ''}" data-sec="${sec.id}"><div class="sh" role="button" tabindex="0" aria-expanded="${open}"><span class="dot" style="background:${its.length && n === its.length ? 'var(--ok)' : n ? 'var(--gold)' : 'var(--line2)'}"></span><b>${sec.name}</b>${sec.rated ? '<span class="pill" style="font-size:10px">rated</span>' : ''}<span class="prog num">${its.length ? n + '/' + its.length : 'talk'}</span></div><div class="qs">${renderItems(sec.items)}</div></div>`; }).join('')}
      <div class="card"><h3>Flags</h3><p class="muted small" style="margin-bottom:8px">Quick tags that show on the card and in search.</p><div class="flags" style="display:flex;gap:6px;flex-wrap:wrap">${FLAGS.map(f => `<button class="sm ${iv.flags.includes(f) ? 'on' : ''}" data-flag="${f}" ${ro ? 'disabled' : ''}>${f}</button>`).join('')}</div></div>
      <div class="card"><h3>Notes</h3><textarea id="ivNotes" placeholder="Anything not covered above…" style="min-height:110px" ${ro ? 'readonly' : ''}>${esc(iv.notes || '')}</textarea></div>
    </div>
    <aside class="side">
      <div class="card"><div class="row" style="gap:10px"><span class="avatar">${c.first[0]}${c.last[0]}</span><div><b>${name(c)}</b><div class="small muted">${esc(c.city)} · ${dist(c.miles)} to ${c.office} · ${c.phone}</div></div></div><div class="facts" style="grid-template-columns:1fr 1fr"><div class="fact"><span>Source</span><b>${esc(c.source)}</b></div><div class="fact"><span>Applied</span><b>${fmtD(c.applied)}</b></div><div class="fact"><span>Life license</span><b>${c.license}</b></div><div class="fact"><span>Stage</span><b>${S[c.stage].name}</b></div></div>${c.resume || c.indeedUrl ? `<button class="sm" style="margin-top:10px" data-resume="${c.id}">📄 Open resume</button>` : ''}</div>

    </aside>

}

function vCalendar() {
  const mon = new Date(TODAY); mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7) + 7 * (state.calWeek || 0)); mon.setHours(0, 0, 0, 0);
  const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  const days = [...Array(7)].map((_, i) => { const d = new Date(mon); d.setDate(d.getDate() + i); return d; });
  const items = [];
  // Appointments only: tasks (first calls, recontacts) stay on the Tasks page (owner, 2026-10-30).

    const gr = /briefing|group review/i.test(g.summary || '');
    if (!gr && cand && hasAppt(cand.id)) return; // the pre-screen above is this event
    items.push({ gr, who: owner.name || g.organizer || g.calendar, kind: 'google', title: g.summary, when, mins: Math.max(15, (end - when) / 60000), allday: !!g.all_day, cand: cand ? cand.id : null, gurl: g.html_link, meet: g.meet });
  });
  CLASSES.filter(x => x.when).forEach(x => items.push({ who: x.trainer, kind: 'training', title: `${x.name} (${x.roster.length}/${x.cap})`, when: x.when, mins: 240, office: x.office }));
  const calOffice = state.office || ''; // the office switch in the rail (owner, 2026-11-02)
  const vis = items.filter(e => (isAdmin() ? (e.leads || [e.who]).some(w => state.calPeople[w] !== false) : (e.who === ME || e.kind === 'orientation' || e.kind === 'training')) && (!e.office || !state.office || e.office === state.office) && (!e.office || !calOffice || e.office === calOffice) && e.when >= mon && e.when < new Date(mon.getTime() + 7 * 86400000));

  // 8 am to 8 pm: evening pre-screens (6 and 7 pm) are common. Anything earlier or later sits in the first or last row.

  const tip = e => (e.cx ? 'Cancelled by ' + esc(e.cx.by) + ' · ' : '') + esc(e.title) + ' · ' + esc(e.who) + (e.meet ? ' · Google Meet' : '') + (e.kind === 'google' && e.cand ? ' · ' + esc(name(byId(e.cand))) : '');

    <div class="hd"></div>${days.map(d => `<div class="hd ${sameDay(d, TODAY) ? 'today' : ''}">${d.toLocaleDateString('en-US', { weekday: 'short' })}<b>${d.getDate()}</b>${vis.filter(e => e.allday && sameDay(d, e.when)).map(ev).join('')}</div>`).join('')}

function vTasks() {

  const grp = (label, f) => { const xs = list.filter(f); return xs.length ? `<h3 style="margin:14px 0 4px">${label} <span class="muted small num">${xs.length}</span></h3>${xs.map(taskRow).join('')}` : ''; };
  return `
  <div class="bar"><h1>Tasks</h1><div class="seg" id="taskWho"><button aria-pressed="${mine === ME}" data-who="${esc(ME)}">Mine</button>${TEAM.filter(t => t.name !== ME).map(t => `<button aria-pressed="${mine === t.name}" data-who="${esc(t.name)}" title="${esc(t.role)}">${t.name.split(' ')[0]}</button>`).join('')}<button aria-pressed="${mine === ''}" data-who="">Everyone</button></div><button class="primary" id="addTask">+ Task</button></div>

function taskRow(t) { const c = byId(t.cand); const dd = daysBetween(t.due, TODAY); return `<div class="task ${t.done ? 'done' : ''}"><input type="checkbox" ${t.done ? 'checked' : ''} data-task="${t.id}" aria-label="Done"><div class="t"><b>${esc(t.what)}</b><small><a href="#" data-cand="${c.id}">${name(c)}</a> · ${stagePill(c.stage)} · ${av(t.who)} ${esc(t.who.split(' ')[0])}</small></div><span class="due ${t.done ? '' : dd > 0 ? 'over' : dd === 0 ? 'today' : ''}">${t.done ? 'Done' : dd > 0 ? `${dd}d overdue` : dd === 0 ? 'Today' : fmtD(t.due)}</span></div>`; }

/* The pre-screen follow-up: when they had no time for the full pre-assessment, the recruiter books a follow-up from
   the screener. It becomes the pre-screen appointment (so it shows on the card and the calendar), a task for the
   recruiter, and the card moves to Pre-screen scheduled with that stage's automations. */
function bookFollowUp(c) {
  const iv = c.prescreen; if (!iv) return; const f = iv.fields || {};
  if (!f.f_fu_date || !f.f_fu_time) { toast('Enter the follow-up date and time first.'); return; }
  const when = new Date(f.f_fu_date + 'T' + f.f_fu_time); if (isNaN(when)) { toast('That date and time do not read.'); return; }
  const how = f.f_fu_how || 'Video chat · earliest available'; const from = c.stage; const now = new Date(TODAY.getTime() + 60000);
  if (f.f_fu_email) c.email = f.f_fu_email;
  iv.when = when; iv.how = how; iv.by = ME; iv.followUp = true;
  const task = TASKS.find(x => x.cand === c.id && !x.done && x.kind === 'followup');
  if (task) { task.due = when; task.what = `Pre-screen follow-up · ${how}`; task.who = ME; } else TASKS.push({ id: nextId++, cand: c.id, who: ME, what: `Pre-screen follow-up · ${how}`, due: when, done: false, kind: 'followup' });
  const firstCall = TASKS.filter(x => x.cand === c.id && !x.done && x.kind === 'call' && /^(First call|Recontact)/.test(x.what)); firstCall.forEach(x => x.done = true);
  touch(c, now);
  if (from !== 'prescreen') {
    const rules = RULES.prescreen.filter(r => r.when === 'enter' && !r.off && isLive(r));
    c.stage = 'prescreen'; c.stageEntered = now;
    c.notes.push({ at: now, by: ME, kind: 'status', text: `Moved from ${S[from].name} to ${S.prescreen.name} · Pre-screen follow-up ${fmtDT(when)} (${how}). Reached on the first call; no time for the full pre-assessment.${firstCall.length ? ' First-call task closed.' : ''}` });
    rules.forEach(r => { c.notes.push({ at: new Date(now.getTime() + 1000), by: 'Automation', kind: 'auto', text: `${TYPE_NAME[r.type]} ${TO_NAME[r.to]}: ${r.what}` }); if (r.type === 'task') TASKS.push({ id: nextId++, cand: c.id, who: assignee(r.to, c), what: r.what, due: new Date(now.getTime() + 86400000), done: false, kind: 'todo' }); });
    if (rules.some(r => r.type === 'calendar')) setTimeout(() => sendInvite(c), 0);
    toast(`<b>${name(c)}</b> moved to ${S.prescreen.name}. Follow-up ${fmtDT(when)} (${how}) is on the calendar and in Tasks${rules.length ? `; ran ${rules.length} automation${rules.length === 1 ? '' : 's'}` : ''}.`);
  } else {
    c.notes.push({ at: now, by: ME, kind: 'status', text: `Pre-screen follow-up rebooked for ${fmtDT(when)} (${how})` });
    if (c.gcal) setTimeout(() => sendInvite(c), 0);
    toast(`Follow-up moved to <b>${fmtDT(when)}</b> (${how}).`);
  }
  render();
}

    if (d.ok) { toast(`Inbox: <b>${d.seen}</b> new notice${d.seen === 1 ? '' : 's'} → <b>${d.created}</b> new candidate${d.created === 1 ? '' : 's'}, ${d.notes} message${d.notes === 1 ? '' : 's'}, ${d.skipped} skipped.`); if (d.created || d.notes) setTimeout(() => pull(), 500); }
    else toast('Inbox pull failed: <b>' + esc(d.why === 'not_configured' ? 'the inbox approval is not loaded yet' : d.why === 'reauthorize' ? 'the inbox approval expired; run authorize-inbox.mjs again' : d.why || ('HTTP ' + r.status)) + '</b>.');
  });
  document.addEventListener('click', e => {
    if (e.target.closest('#lbExport')) {
      const blob = new Blob([ser(snapshot())], { type: 'application/json' }); const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'lgcy-onboard-' + new Date().toISOString().slice(0, 10) + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      toast('Exported <b>' + CANDS.length + '</b> candidates and <b>' + TASKS.length + '</b> tasks.');
    }
    if (e.target.closest('#lbImport')) document.getElementById('lbFile').click();
  });
  document.getElementById('lbFile').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    f.text().then(txt => {
      let d; try { d = JSON.parse(txt, rev); } catch (err) { toast('That file is not JSON.'); return; }
      modal(`<h2>Replace the data for everyone?</h2><p class="muted">The file holds <b>${(d.cands || []).length}</b> candidates and <b>${(d.tasks || []).length}</b> tasks${d.savedAt ? ', saved ' + new Date(d.savedAt).toLocaleString() : ''}. Everything online now will be replaced for every user. Export first if you want to keep it.</p><div class="row" style="justify-content:flex-end;margin-top:14px"><button data-close>Cancel</button><button class="primary" id="lbDoImport">Replace</button></div>`, () => {
        document.getElementById('lbDoImport').addEventListener('click', () => {
          try { apply(d); } catch (err) { toast('Could not read that file: ' + esc(err.message)); closeModal(); return; }
          closeModal(); state.cand = null; state.iv = null; render(); toast('Imported <b>' + CANDS.length + '</b> candidates; saving for everyone.');
        });
      });
    });
    e.target.value = '';
  });

  state.cand = null; state.iv = null;
  render0(); adminData(); status();
  if (!version) save(); // first run: store the record so the Users list exists for sign-ins
})();
</script>
