<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LGCY Onboard · Sign in</title>
<link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png"><link rel="apple-touch-icon" href="/brand/apple-touch-icon.png"><link rel="manifest" href="/brand/manifest.webmanifest">
<meta name="theme-color" content="#0b0b0a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="LGCY Onboard">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root { --bg:#0b0b0a; --card:#141412; --card2:#181713; --well:#0f0e0c; --line:#2b281f; --line2:#3d3620; --fg:#ece6d6; --muted:#9c9583; --gold:#e3bf5e; --gold2:#f1d27a; --ink:#1d1503; --bad:#e0705e; --ok:#5fc58a;
  --gold-metal: linear-gradient(180deg, #fff1b8 0%, #f0cf6c 22%, #c9952e 48%, #a8781c 56%, #dcb455 78%, #f8e39a 100%); --gold-text: linear-gradient(180deg, #fff3c4 0%, #f1d27a 35%, #c8963c 62%, #e9c76a 100%); --raise: linear-gradient(180deg, #2c2922 0%, #1c1a15 55%, #15130f 100%); color-scheme: dark; }
* { box-sizing: border-box; } html, body { height: 100%; }
body { margin: 0; background: radial-gradient(700px 400px at 50% -10%, #1d1a10 0%, transparent 60%), var(--bg); color: var(--fg); font: 15px/1.5 Inter, system-ui, sans-serif; display: grid; place-items: center; padding: 20px; }
.card { width: 100%; max-width: 400px; background: linear-gradient(180deg, var(--card2), var(--card)); border: 1px solid var(--line); border-radius: 14px; padding: 26px 26px 22px; box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 12px 36px rgba(0,0,0,.45); }
.brand { display: flex; align-items: center; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.brand img { height: 38px; width: auto; display: block; }
.brand b { display: block; font: 400 17px/1 Michroma, sans-serif; letter-spacing: .1em; background: var(--gold-text); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand small { display: block; margin-top: 5px; font: 400 8.5px/1 Michroma, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0 0 4px; font: 400 18px/1.3 Michroma, sans-serif; letter-spacing: .04em; }
p { margin: 0; color: var(--muted); font-size: 13.5px; }
label { display: block; margin-top: 16px; font-size: 12px; color: var(--muted); }
input { width: 100%; margin-top: 5px; font: 500 16px Inter, system-ui, sans-serif; color: var(--fg); background: var(--well); border: 1px solid var(--line2); border-radius: 8px; padding: 10px 12px; box-shadow: inset 0 1px 3px rgba(0,0,0,.6); letter-spacing: .02em; }
input.code { font: 600 26px/1 Inter, system-ui, sans-serif; letter-spacing: .35em; text-align: center; }
input:focus { outline: none; border-color: var(--gold); }
button { margin-top: 16px; width: 100%; background: var(--gold-metal); color: var(--ink); border: 1px solid #8a6516; border-radius: 9px; padding: 11px 14px; cursor: pointer; font: 700 14.5px Inter, system-ui, sans-serif; text-shadow: 0 1px 0 rgba(255,240,190,.55); box-shadow: inset 0 1px 0 rgba(255,250,220,.85), inset 0 -2px 0 rgba(110,72,8,.45), 0 2px 0 #5a3f0a, 0 4px 10px rgba(0,0,0,.5); }
button:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255,250,220,.6), 0 0 0 #5a3f0a; }
button.ghost { background: none; border-color: transparent; color: var(--muted); box-shadow: none; text-shadow: none; font-weight: 500; margin-top: 8px; }
button:disabled { opacity: .6; cursor: wait; }
.msg { margin-top: 12px; font-size: 13px; min-height: 18px; } .msg.bad { color: var(--bad); } .msg.ok { color: var(--ok); }
.hide { display: none; }
.foot { margin-top: 18px; font-size: 11.5px; color: var(--muted); text-align: center; }
</style></head><body>
<form class="card" id="f" autocomplete="on">
  <div class="brand"><img src="/brand/legacy-mark-light.png" alt=""><span><b>LEGACY</b><small>LGCY Onboard</small></span></div>
  <div id="step1"><h1>Sign in</h1><p>Enter your work email. We'll email you a 6-digit code.</p>
    <label>Email<input type="email" id="email" name="email" autocomplete="username" required autofocus placeholder="you@lgcyap.com"></label>
    <button type="submit" id="go1">Email me a code</button></div>
  <div id="step2" class="hide"><h1>Check your email</h1><p>The code went to <b id="who" style="color:var(--fg)"></b>. It works for 10 minutes.</p>
    <label>Code<input type="text" id="code" name="one-time-code" class="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="••••••"></label>
    <button type="submit" id="go2">Sign in</button><button type="button" class="ghost" id="back">Use a different email</button></div>
  <div class="msg" id="msg"></div>
  <div class="foot">Legacy Agency Partners · recruiting team only</div>
</form>
<script>
const $ = (s) => document.querySelector(s); let step = 1;
const msg = (t, cls) => { const m = $('#msg'); m.textContent = t || ''; m.className = 'msg ' + (cls || ''); };
$('#back').onclick = () => { step = 1; $('#step1').classList.remove('hide'); $('#step2').classList.add('hide'); msg(''); $('#email').focus(); };
$('#f').onsubmit = async (e) => {
  e.preventDefault(); const email = $('#email').value.trim().toLowerCase();
  if (step === 1) {
    $('#go1').disabled = true; msg('Sending…');
    const r = await fetch('/api/login/start', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ email }) }).then(r => r.json()).catch(() => ({}));
    $('#go1').disabled = false;
    if (!r.ok) { msg(r.why === 'mail_not_configured' ? 'Email sending is not set up yet. Ask Carlos.' : r.why === 'email' ? 'That does not look like an email address.' : 'Could not send the code. Try again in a minute.', 'bad'); return; }
    step = 2; $('#who').textContent = email; $('#step1').classList.add('hide'); $('#step2').classList.remove('hide'); msg('If that email is on the team, the code is on its way.'); $('#code').focus();
  } else {
    const code = $('#code').value.replace(/\D/g, ''); if (code.length !== 6) { msg('Enter the 6 digits.', 'bad'); return; }
    $('#go2').disabled = true; msg('Checking…');
    const r = await fetch('/api/login/verify', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ email, code }) }).then(r => r.json()).catch(() => ({}));
    $('#go2').disabled = false;
    if (!r.ok) { msg(r.why === 'expired' ? 'That code expired. Ask for a new one.' : r.why === 'tries' ? 'Too many tries. Ask for a new code.' : 'That code is not right.', 'bad'); return; }
    msg('Signed in. Opening…', 'ok'); location.replace('/' + location.hash);
  }
};
$('#code').addEventListener('input', () => { if ($('#code').value.replace(/\D/g, '').length === 6) $('#f').requestSubmit(); });
</script></body></html>
